# SIGAP — nginx di dalam container. TLS selesai di Cloudflare (Tunnel/cloudflared);
# container ini hanya menerima HTTP dari cloudflared lewat 127.0.0.1 / jaringan Docker.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# cloudflared mengirim X-Forwarded-Proto: https. Port web hanya terbuka di 127.0.0.1,
# jadi header ini hanya bisa datang dari cloudflared (atau pengujian lokal).
map $http_x_forwarded_proto $sigap_https {
    default "";
    https   on;
}
map $http_x_forwarded_proto $sigap_port {
    default $server_port;
    https   443;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    # Selaras dengan php post_max_size=12M & validasi lampiran 5 MB.
    client_max_body_size 12m;

    # IP asli klien: cloudflared meneruskan CF-Connecting-IP. Percayai hanya alamat lokal/Docker.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    include /etc/nginx/snippets/sigap-security-headers.conf;

    # Berkas tersembunyi (.env, .git, …) — kecuali .well-known.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Aset Vite ber-hash: cache selamanya.
    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/sigap-security-headers.conf;
        access_log off;
    }

    location ~* \.(?:ico|png|jpe?g|webp|gif|svg|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        include /etc/nginx/snippets/sigap-security-headers.conf;
        access_log off;
    }

    # WebSocket Reverb (protokol Pusher: /app/{key}) → container reverb:8080
    location ~ ^/app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # HTTP API Reverb hanya dipakai PHP langsung ke reverb:8080 di jaringan internal.
    location ^~ /apps/ {
        return 403;
    }

    # Hanya front controller yang dieksekusi.
    location = /index.php {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTPS $sigap_https if_not_empty;
        fastcgi_param SERVER_PORT $sigap_port;
        # Buffer fastcgi diperbesar: Laravel mengirim Set-Cookie + session besar
        # sehingga nginx default (4k) memicu "upstream sent too big header" → 502.
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
        # Abaikan header forwarding dari klien (Laravel juga tidak mempercayainya).
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_param HTTP_X_FORWARDED_PORT "";
        fastcgi_param HTTP_X_FORWARDED_PROTO "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_hide_header Strict-Transport-Security;
        fastcgi_hide_header X-Content-Type-Options;
        fastcgi_hide_header X-Frame-Options;
        fastcgi_hide_header Referrer-Policy;
        fastcgi_hide_header Permissions-Policy;
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        return 404;
    }
}
