; PgBouncer Contact Center (rencana §9.3). Tanpa rahasia. userlist.txt (tidak di-commit) dibuat
; scripts/deploy-uji.sh dari .env berisi sandi role cc_* apa adanya: PgBouncer memakai sandi itu untuk SCRAM
; ke klien maupun ke PostgreSQL. `postgres` = service PostgreSQL stack ini (jaringan `db`, compose.yml).
; Klien memakai alias contact_center*; database fisik contact_center_uji.

[databases]
; cc_app (DML) & cc_readonly (laporan): transaction pooling.
contact_center = host=postgres port=5432 dbname=contact_center_uji
; cc_migrate (DDL): session pooling — migrasi butuh kunci advisory & state sesi.
contact_center_migrate = host=postgres port=5432 dbname=contact_center_uji pool_mode=session pool_size=2 max_db_connections=2

; Ukuran pool: VM 8 vCPU dibagi banyak stack; PostgreSQL uji max_connections 100. Lebih dari ±2–3 query
; aktif per vCPU hanya menambah antrean di Postgres, jadi koneksi server dibatasi kecil; klien yang
; menunggu antre di PgBouncer (murah). max_db_connections berlaku per alias: contact_center ≤ 20,
; contact_center_migrate ≤ 2. WAJIB divalidasi saat uji beban k6 (rencana §9.8): `SHOW POOLS;` di
; konsol admin (butuh user di stats_users, isi sementara saat uji) — cl_waiting yang terus > 0
; berarti pool terlalu kecil.
[users]
; Laporan/ekspor tidak boleh menghabiskan pool milik cc_app.
cc_readonly = max_user_connections=5

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 10
reserve_pool_size = 5
; Batas keras koneksi ke PostgreSQL per alias (termasuk reserve pool).
max_db_connections = 20
; Prepared statement protokol (driver `pg`) aman di transaction pooling.
max_prepared_statements = 200
; Klien yang antre menunggu koneksi server paling lama 10 dtk lalu gagal cepat (bawaan 120 dtk, lebih lama dari
; stop_grace_period cc-web 30 dtk).
query_wait_timeout = 10
ignore_startup_parameters = extra_float_digits
admin_users =
