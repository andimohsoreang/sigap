; PgBouncer Contact Center (rencana §9.3). Tanpa rahasia; sandi di userlist.txt (tidak di-commit,
; mode 600), diisi verifier SCRAM persis dari PostgreSQL supaya PgBouncer bisa login ke server:
;   SELECT '"' || rolname || '" "' || rolpassword || '"' FROM pg_authid WHERE rolname LIKE 'cc\_%';
; `db` = service PostgreSQL stack Laravel, dijangkau lewat jaringan `laravel` (lihat compose.yml).
; Klien memakai alias contact_center*; database fisik tetap `sigap` sampai S17 (rencana §10.2) —
; rename nanti cukup mengubah dbname= di sini.

[databases]
; cc_app (DML) & cc_readonly (laporan): transaction pooling.
contact_center = host=db port=5432 dbname=sigap
; cc_migrate (DDL): session pooling — migrasi butuh kunci advisory & state sesi.
contact_center_migrate = host=db port=5432 dbname=sigap pool_mode=session pool_size=2

; Ukuran pool: VM 8 vCPU dan PostgreSQL dibagi dengan Laravel (±24 koneksi). Lebih dari ±2–3 query
; aktif per vCPU hanya menambah antrean di Postgres, jadi koneksi server dibatasi kecil; klien yang
; menunggu antre di PgBouncer (murah). max_db_connections berlaku per alias: contact_center ≤ 20,
; contact_center_migrate ≤ 2. WAJIB divalidasi saat uji beban k6 (rencana §9.8): `SHOW POOLS;` di
; konsol admin (butuh user di stats_users, isi sementara saat uji) — cl_waiting yang terus > 0
; berarti pool terlalu kecil.
[users]
; Laporan/ekspor tidak boleh menghabiskan pool milik cc_app.
cc_readonly = max_user_connections=5

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 1000
default_pool_size = 10
reserve_pool_size = 5
; Batas keras koneksi ke PostgreSQL per alias (termasuk reserve pool).
max_db_connections = 20
; Prepared statement protokol (driver `pg`) aman di transaction pooling.
max_prepared_statements = 200
ignore_startup_parameters = extra_float_digits
admin_users =
