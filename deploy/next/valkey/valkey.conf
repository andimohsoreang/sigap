# Valkey Contact Center (rencana §9.4). Sandi lewat --requirepass di compose.yml.
# Isinya cache, rate limit, kunci, state AI: boleh hilang sebagian, aplikasi jatuh ke DB/batas lokal.
port 6379
dir /data

# Persistensi: AOF tiap detik + snapshot, supaya restart tidak mengosongkan rate limit & state AI.
appendonly yes
appendfsync everysec
save 900 1 300 100 60 10000

# noeviction: tidak ada kunci yang dibuang diam-diam (rate limit & kunci terdistribusi tetap benar).
# Konsekuensi untuk aplikasi: SETIAP kunci cache WAJIB ber-TTL (SET ... EX), dan saat memori penuh
# perintah tulis ditolak (galat OOM) — aplikasi memperlakukannya seperti Valkey mati (rencana §9.4):
# cache dibaca langsung dari DB, rate limit jatuh ke batas konservatif per-instance.
maxmemory 512mb
maxmemory-policy noeviction
