# Contact Center (Next.js) — stack SUBDOMAIN UJI `cc-uji.andimohamad.my.id` (docs/slices/S0-gelombang2.md, paket H).
# Berdiri sendiri: DB, Valkey, Sockudo (realtime), PgBouncer milik stack ini; TIDAK berbagi jaringan, sesi, atau DB dengan
# Laravel app2 (strategi tanpa jembatan, docs/RENCANA-PER-FITUR.md §0). Lokasi server: clone terpisah /opt/cc-uji.
#
# Jalankan lewat skrip (validasi .env, userlist PgBouncer, tag SHA, backup, health check, rollback):
#   cp deploy/next/.env.example deploy/next/.env && chmod 600 deploy/next/.env   # isi nilainya
#   bash scripts/deploy-uji.sh
#
# Jalur masuk: cloudflared (host) → Cloudflare Access → http://localhost:8094 → cc-web:3000. Hanya loopback:
# Docker melewati ufw untuk port yang dipublikasikan, jadi JANGAN ubah ke 0.0.0.0. Satu replica, karena port
# host hanya bisa dipakai satu container (replica lebih dari satu butuh load balancer di depan — saat pergantian).
#
# Realtime untuk browser: SATU origin, lewat path di cc-web (tanpa hostname tunnel kedua, cloudflared tidak diubah).
#   Browser  wss://cc-uji…/_realtime/app/<key>  →  cc-web (rewrite Next.js)  →  ws://sockudo:6001/app/<key>
#   Next.js 16.4.6 meneruskan upgrade WebSocket untuk rewrite ke URL eksternal (router-server upgradeHandler →
#   proxyRequest; diuji paket G pada server standalone: path, query & Origin sampai utuh). Rewrite di
#   web/next.config.ts (tujuan sockudo:6001 ditanam saat build), opsi klien pusher-js di web/src/lib/realtime.ts:
#   { wsHost: location.hostname, wsPath: '/_realtime', forceTLS: true, enabledTransports: ['ws', 'wss'] }.
#   Hanya endpoint WebSocket /app/:key yang diteruskan; HTTP API (/apps/:id/events, bertanda tangan HMAC), /up,
#   /usage, /stats hanya terjangkau dari jaringan backend. Cookie Cloudflare Access ikut otomatis (origin sama).
#   Harga: koneksi WS melewati proses Node cc-web (restart cc-web memutus WS; pusher-js menyambung ulang).
#   Cukup untuk UAT; untuk skala nasional WS dipisah di edge/LB saat pergantian akhir.
#
# Jaringan:
#   default  bridge biasa: hanya cc-web (port 8094) & worker (panggilan keluar: AI, reCAPTCHA, SMTP).
#   backend  internal (tanpa egress): cc-web, worker, migrate, valkey, pgbouncer, sockudo.
#   db       internal: HANYA pgbouncer + postgres. Aplikasi tidak bisa menyentuh postgres langsung, dan superuser
#            `postgres` tidak ada di userlist PgBouncer → login superuser hanya dari dalam container postgres.
#
# Anggaran sumber daya (server dibagi ±27 container, rencana §9.10): total batas 5,0 CPU / ±3,3 GB
# (cc-web 1,5 + worker 1 + postgres 1 + sockudo/valkey/pgbouncer 0,5 masing-masing; migrate sekali jalan).

name: contact-center-uji

# x-config-hash: pgbouncer, valkey, sockudo membaca berkas config hanya saat start, dan bind mount satu berkas tetap
# memegang inode lama setelah `git pull` (17 Nov: pgbouncer.ini baru tidak terbaca). Label cc.config-hash = sha256
# isi berkas config service itu, dihitung scripts/deploy-uji.sh; label berubah → `up -d` membuat ulang HANYA service
# itu. Tanpa skrip nilainya "manual". Berkas uji/ (init postgres) tidak di-hash: hanya dibaca saat volume kosong.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

# Env aplikasi: hanya kunci yang dibutuhkan, diinterpolasi dari .env (tanpa env_file, supaya sandi postgres &
# cc_migrate tidak pernah masuk container web/worker). Nama kunci untuk paket F/G: VALKEY_URL, REALTIME_*
# (netral vendor: server realtime berprotokol Pusher).
x-app-env: &app-env
  APP_URL: ${APP_URL:?APP_URL wajib diisi di .env}
  APP_KEY: ${APP_KEY:?APP_KEY wajib diisi di .env}
  APP_PREVIOUS_KEYS: ${APP_PREVIOUS_KEYS:-}
  NIK_HASH_KEY: ${NIK_HASH_KEY:?NIK_HASH_KEY wajib diisi di .env}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # `contact_center` = alias PgBouncer (transaction pooling) untuk database contact_center_uji.
  DATABASE_URL: postgres://cc_app:${CC_APP_PASSWORD:?}@pgbouncer:6432/contact_center
  DATABASE_URL_READONLY: postgres://cc_readonly:${CC_READONLY_PASSWORD:?}@pgbouncer:6432/contact_center
  VALKEY_URL: redis://:${VALKEY_PASSWORD:?}@valkey:6379/0
  REALTIME_HOST: sockudo
  REALTIME_PORT: "6001"
  REALTIME_APP_ID: ${REALTIME_APP_ID:?}
  REALTIME_APP_KEY: ${REALTIME_APP_KEY:?}
  REALTIME_APP_SECRET: ${REALTIME_APP_SECRET:?}
  # Site key reCAPTCHA (publik): domain Google di CSP. Kosong → CSP tanpa reCAPTCHA (seperti Laravel tanpa site key).
  RECAPTCHA_SITE_KEY: ${RECAPTCHA_SITE_KEY:-}
  # Prop bersama `assistant` (HandleInertiaRequests): kosong → bawaan Laravel (false / label config/services.php).
  AI_ENABLED: ${AI_ENABLED:-false}
  AI_SERVICE_LABEL: ${AI_SERVICE_LABEL:-}

x-app: &app
  <<: *hardening
  image: ${CC_IMAGE:-contact-center-uji}:${CC_TAG:-uji}
  pull_policy: never
  init: true
  depends_on:
    valkey:
      condition: service_healthy
    pgbouncer:
      condition: service_healthy

services:
  cc-web:
    <<: *app
    build:
      context: ../..
      dockerfile: deploy/next/Dockerfile
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: contact-center-web
      DB_POOL_MAX: "10" # = default_pool_size PgBouncer alias contact_center
      DB_APP_NAME: cc-web
    ports:
      - "127.0.0.1:8094:3000"
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/web/.next/cache:size=256m,mode=1777
    networks: [default, backend]
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 768M }
    # Shutdown (rencana §9.5): init: true meneruskan SIGTERM ke node; Next.js 16.4.6 memasang
    # handler SIGTERM/SIGINT sendiri (server.close → nextServer.close, menunggu kerja after(),
    # lalu exit 143). Paket A menambah drain keep-alive dan paksa keluar setelah 25 dtk, jadi
    # grace period harus > 25 dtk sebelum Docker mengirim SIGKILL.
    stop_grace_period: 30s

  # pg-boss (antrean ai/default/ingest + jadwal port Laravel) + dispatcher outbox → pg-boss & Sockudo.
  # Bundel web/src/worker/main.ts (scripts/bangun-worker.mjs). Skema pgboss harus sudah dipasang service
  # `migrate` (scripts/deploy-uji.sh menjalankannya sebelum `up`): worker sebagai cc_app hanya DML.
  # Lewat PgBouncer mode transaksi: pg-boss tanpa LISTEN/NOTIFY & kunci advisory sesi (web/src/worker/boss.ts).
  worker:
    <<: *app
    # Bundel di-minify; --enable-source-maps mengembalikan berkas:baris asli (src/...) di stack trace log.
    command: ["node", "--enable-source-maps", "dist/worker.mjs"]
    environment:
      <<: *app-env
      OTEL_SERVICE_NAME: contact-center-worker
      # Pool terpisah (alias PgBouncer contact_center_worker, 3 koneksi server): job berat tidak menghabiskan
      # pool request web.
      DATABASE_URL: postgres://cc_app:${CC_APP_PASSWORD:?}@pgbouncer:6432/contact_center_worker
      DB_POOL_MAX: "3"
      DB_APP_NAME: cc-worker
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [default, backend]
    healthcheck:
      disable: true # HEALTHCHECK image memeriksa HTTP /up milik cc-web
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    stop_grace_period: 60s

  # Migrasi sekali jalan dengan role cc_migrate (kredensial hanya di service ini). Skema Laravel TIDAK lewat
  # sini, tapi lewat init postgres (uji/init.sh). Service ini: tabel khusus Next.js (web/drizzle-cc: cc_outbox,
  # cc_idempotency, catatan di public.cc_migrasi) + skema pg-boss `pgboss` & antreannya + hak DML cc_app.
  # Idempoten; dijalankan scripts/deploy-uji.sh tiap deploy (`run --rm migrate`).
  migrate:
    <<: *hardening
    profiles: ["migrate"]
    image: ${CC_IMAGE:-contact-center-uji}:${CC_TAG:-uji}
    pull_policy: never
    restart: "no"
    init: true
    command: ["node", "--enable-source-maps", "dist/migrate.mjs"]
    environment:
      # Alias session pooling: DDL butuh state sesi & kunci advisory.
      DATABASE_URL_MIGRATE: postgres://cc_migrate:${CC_MIGRATE_PASSWORD:?}@pgbouncer:6432/contact_center_migrate
      LOG_LEVEL: ${LOG_LEVEL:-info}
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [backend]
    healthcheck:
      disable: true
    depends_on:
      pgbouncer:
        condition: service_healthy

  # Realtime berprotokol Pusher (rencana §9.4–9.5): Sockudo, keputusan pemilik 15 Nov 2026 (ganti Soketi).
  # Rantai pasok: github.com/sockudo/sockudo, MIT, ±850 bintang, 1 maintainer utama (±1000 commit) + ±10
  # kontributor aktif, rilis ±2–4 minggu (v4.3.0 Apr 2026 → v5.2.0 22 Okt 2026), image resmi Docker Hub & GHCR.
  # Rust, Dockerfile tanpa target-cpu → baseline x86-64; uji CPU server: scripts/cek-binary-native.sh.
  # Satu instance, adapter `local` (bawaan): tanpa Valkey. Adapter redis (Valkey) baru perlu saat ≥ 2 instance.
  sockudo:
    <<: *hardening
    # Dipin digest index multi-arch 5.2.0 (Docker Hub, 15 Nov 2026). Image berjalan sebagai user `sockudo`.
    image: sockudo/sockudo:5.2.0@sha256:802c27d7f24bbaed29e410de0c0555cacecd42f7e6609e28e8e198780786f172
    # Tanpa --config, dan /app/config diganti tmpfs kosong: config/config.json bawaan image berisi app demo
    # (app-key/app-secret, client events aktif, mode development, CORS *). Jadi: nilai bawaan kode + env di bawah.
    command: ["sockudo"]
    # Env tanpa rahasia (mode, push, antrean, driver, metrics) dari satu sumber yang juga dipakai
    # scripts/cek-binary-native.sh — penjelasan tiap kunci ada di berkas itu.
    env_file: sockudo.env
    labels:
      cc.config-hash: ${CC_HASH_SOCKUDO:-manual} # lihat x-config-hash di atas
    environment:
      # SOCKUDO_DEFAULT_APP_* mengganti semua app inline. Batas bawaan app ini 100 (koneksi, event/dtk,
      # payload 100 KB) — cukup untuk UAT; dinaikkan lewat SOCKUDO_DEFAULT_APP_MAX_* sebelum pergantian.
      SOCKUDO_DEFAULT_APP_ID: ${REALTIME_APP_ID:?}
      SOCKUDO_DEFAULT_APP_KEY: ${REALTIME_APP_KEY:?}
      SOCKUDO_DEFAULT_APP_SECRET: ${REALTIME_APP_SECRET:?}
      # Origin WebSocket wajib origin aplikasi (tanpa header Origin → ditolak); diteruskan apa adanya oleh rewrite.
      SOCKUDO_DEFAULT_APP_ALLOWED_ORIGINS: ${APP_URL:?}
    tmpfs:
      - /app/config:size=1m
      - /tmp:size=16m,mode=1777
    networks: [backend]
    healthcheck:
      # /up = liveness + status adapter; 503 saat draining.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:6001/up"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    stop_grace_period: 15s # shutdown_grace_period bawaan 10 dtk

  # Cache, rate limit, kunci, pub/sub (rencana §9.4). Prefix kunci `cc:` diatur di aplikasi.
  valkey:
    <<: *hardening
    image: valkey/valkey:9.0.7-alpine3.24@sha256:2d04268dfa26ab31cfa3fdc538866e76438b2d00e41db41b8cb86d780ac5a416
    user: valkey # data volume baru mewarisi pemilik /data dari image; entrypoint tak perlu chown
    # Sandi diinterpolasi compose dari .env (pakai hex, tanpa `$`).
    command: ["valkey-server", "/usr/local/etc/valkey/valkey.conf", "--requirepass", "${VALKEY_PASSWORD:?VALKEY_PASSWORD wajib diisi di .env}"]
    environment:
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD}
    labels:
      cc.config-hash: ${CC_HASH_VALKEY:-manual} # lihat x-config-hash di atas
    volumes:
      - ./valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
      - valkey-data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 640M } # maxmemory 512mb + overhead

  # Transaction pooling (rencana §9.3). userlist.txt dibuat scripts/deploy-uji.sh dari .env (tidak di-commit).
  pgbouncer:
    <<: *hardening
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    labels:
      cc.config-hash: ${CC_HASH_PGBOUNCER:-manual} # lihat x-config-hash di atas
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    tmpfs:
      - /tmp:size=8m
    networks: [backend, db]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  # PostgreSQL milik stack uji. Keluarga image sama dengan DB Laravel produksi & CI paritas (digest sama dengan
  # .github/workflows/paritas.yml, PostgreSQL 16.16). Volume kosong → uji/init.sh membuat role cc_* lalu memuat
  # skema + seed baseline (tanpa PHP). TZ server tetap UTC seperti produksi (jangan set TZ di sini).
  postgres:
    <<: *hardening
    image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
    # uid 70: entrypoint tidak perlu chown/gosu (cap_drop ALL tetap jalan); volume baru mewarisi pemilik
    # PGDATA dari image.
    user: postgres
    environment:
      POSTGRES_DB: contact_center_uji
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di .env}
      CC_MIGRATE_PASSWORD: ${CC_MIGRATE_PASSWORD:?}
      CC_APP_PASSWORD: ${CC_APP_PASSWORD:?}
      CC_READONLY_PASSWORD: ${CC_READONLY_PASSWORD:?}
    volumes:
      - pgdata-uji:/var/lib/postgresql/data
      - ./uji/init.sh:/docker-entrypoint-initdb.d/10-uji.sh:ro
      - ./uji/schema.sql:/uji/schema.sql:ro
      - ./uji/seed.sql:/uji/seed.sql:ro
    tmpfs:
      - /var/run/postgresql:size=1m,mode=1777
      - /tmp:size=64m,mode=1777
    networks: [db]
    healthcheck:
      # Lewat TCP: selama init (server sementara, hanya socket) belum dianggap sehat.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "contact_center_uji"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }
    stop_grace_period: 60s # SIGINT (fast shutdown) + checkpoint sebelum SIGKILL

volumes:
  valkey-data:
  pgdata-uji:

networks:
  default:
  backend:
    internal: true
  db:
    internal: true
