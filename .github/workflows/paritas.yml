name: paritas

# Suite paritas (parity/) terhadap Laravel lokal. Laravel di-boot oleh webServer
# parity/playwright.config.ts → parity/scripts/laravel.sh (konfigurasi cermin produksi dari
# parity/env/laravel.env, PostgreSQL cc_paritas milik cc_migrate); CI hanya menyiapkan PostgreSQL,
# dependensi sigap/, dan menjalankan Playwright. laravel.sh menolak jalan bila sigap/ berbeda dari tag
# laravel-baseline, jadi checkout memuat riwayat & tag.
#
# Job berjalan di container resmi Playwright yang dipin digest (rencana §8.3: baseline & pembandingan di
# container yang sama) supaya font/FreeType tidak bergeser mengikuti apt runner. Paket font dicatat di
# awal, di-hold sebelum apt, dan job gagal bila langkah apt (git, psql, PHP) tetap mengubahnya.
#
# Baseline visual (parity/README.md): PNG/DOM Laravel dibuat di mesin yang sama dengan pembandingan
# (.baseline/, tidak di-commit); hashnya per `${platform}-${arch}` di parity/visual/manifest.json —
# entri CI ini `linux-x64`.
#   - Selama manifest belum punya entri `linux-x64`: PR/push hanya menjalankan project `http`.
#   - Mode tulis = workflow_dispatch (hanya muncul bila workflow ada di `main`) ATAU push ke branch
#     `rewrite/baseline-linux` → `npm run baseline -- tulis` sekali di container (tanpa cek dulu); artefak
#     `baseline-visual-linux` berisi visual/manifest.json (entri linux-x64) + .baseline/ untuk
#     ditinjau manusia, lalu commit HANYA visual/manifest.json.
#   - Setelah entri `linux-x64` ter-commit, langkah suite otomatis beralih ke
#     `npm run baseline && npx playwright test --project=http`: baseline sudah menjalankan suite visual
#     dua kali dan mencocokkannya dengan manifest, jadi suite visual tidak diulang ketiga kalinya.
on:
  workflow_dispatch:
  push:
    branches: ['rewrite/**']
    paths: ['parity/**', 'web/**', 'sigap/**', '.github/workflows/paritas.yml']
  # Tinjau ulang filter paths ini bila `paritas` dijadikan required status check: check wajib yang
  # tidak terpicu karena paths tetap "pending" dan memblokir merge.
  pull_request:
    branches: ['rewrite/**', 'feat/contact-center-ai']
    paths: ['parity/**', 'web/**', 'sigap/**', '.github/workflows/paritas.yml']

# Hanya-baca. Unggah artefak memakai token runtime Actions, bukan GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: paritas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paritas:
    name: Paritas vs Laravel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Versi = @playwright/test di parity/package-lock.json (1.63.0). Image sudah memuat Node 24 dan
    # chromium-headless-shell yang cocok (PLAYWRIGHT_BROWSERS_PATH=/ms-playwright), jadi tanpa
    # langkah pasang/cache browser. Naikkan tag + digest bersamaan dengan @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    # Image keluarga yang sama dengan produksi (deploy/docker/compose.yml: postgres:16-alpine), dipin
    # digest: kolasi musl en_US.utf8 = urutan byte, zona UTC, seperti produksi (dicek di bawah).
    services:
      postgres:
        image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
        env:
          # KHUSUS UJI: env/laravel.env memaksa DB_PASSWORD kosong (sama dengan setup lokal `trust`),
          # jadi tanpa sandi. Container hanya hidup selama job di runner sekali pakai, tanpa port host.
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # Paket font image dicatat lalu di-hold SEBELUM apt apa pun: apt gagal keras bila dependensi mencoba
      # meng-upgrade-nya (setup-php dulu meng-upgrade libfreetype6 dan menambah paket -dev).
      - name: Catat & kunci paket font
        run: |
          { dpkg-query -W -f '${Package} ${Version}\n' 'libfreetype*' 'libfontconfig*' 'fontconfig*' 'fonts-*' || true; } | sort > "$RUNNER_TEMP/font-awal.txt"
          cat "$RUNNER_TEMP/font-awal.txt"
          { dpkg-query -W -f '${db:Status-Abbrev} ${Package}\n' 'libfreetype*' 'libfontconfig*' 'fontconfig*' 'fonts-*' 2>/dev/null || true; } \
            | awk '$1 == "ii" { print $2 }' | xargs -r apt-mark hold
          apt-mark showhold

      # git dulu supaya actions/checkout membuat clone sungguhan (laravel.sh memakai git diff).
      # PHP 8.4 dari PPA ondrej/php (noble hanya punya 8.3), kunci diverifikasi fingerprint dari Launchpad;
      # hanya CLI + ekstensi yang dipakai (composer.lock: ctype curl dom fileinfo filter hash iconv json
      # libxml mbstring openssl pcre phar session tokenizer xml xmlwriter zlib; aplikasi: pgsql intl zip
      # bcmath). Tanpa gd: tidak diwajibkan dan membawa FreeType. Composer: phar dipin sha256.
      - name: Paket dasar, PHP 8.4, Composer
        env:
          PHP_PPA_FPR: B8DC7E53946656EFBCE4C1DD71DAEAAB4AD4CAB6
          COMPOSER_VERSION: 2.11.2
          COMPOSER_SHA256: dd158c0afd41d15fac89e1b4e47b5d42911fe316c3687cd5edac98319b25d028
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git postgresql-client
          install -d -m 755 /etc/apt/keyrings
          curl -fsSL "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x${PHP_PPA_FPR}" | gpg --dearmor > /etc/apt/keyrings/ondrej-php.gpg
          fpr="$(gpg --show-keys --with-colons /etc/apt/keyrings/ondrej-php.gpg | awk -F: '/^fpr/ { print $10; exit }')"
          [ "$fpr" = "$PHP_PPA_FPR" ] || { echo "Fingerprint kunci PPA ondrej/php tidak cocok: $fpr" >&2; exit 1; }
          echo "deb [signed-by=/etc/apt/keyrings/ondrej-php.gpg] https://ppa.launchpadcontent.net/ondrej/php/ubuntu noble main" > /etc/apt/sources.list.d/ondrej-php.list
          apt-get update
          apt-get install -y --no-install-recommends php8.4-cli php8.4-pgsql php8.4-mbstring php8.4-xml \
            php8.4-intl php8.4-zip php8.4-bcmath php8.4-curl
          curl -fsSL -o /usr/local/bin/composer "https://getcomposer.org/download/${COMPOSER_VERSION}/composer.phar"
          echo "${COMPOSER_SHA256}  /usr/local/bin/composer" | sha256sum -c -
          chmod 755 /usr/local/bin/composer
          php -v && php -m && composer --version

      - name: Paket font tidak berubah
        run: |
          { dpkg-query -W -f '${Package} ${Version}\n' 'libfreetype*' 'libfontconfig*' 'fontconfig*' 'fonts-*' || true; } | sort > "$RUNNER_TEMP/font-akhir.txt"
          diff "$RUNNER_TEMP/font-awal.txt" "$RUNNER_TEMP/font-akhir.txt"

      # fetch-depth 0: tag laravel-baseline & commit-nya harus ada untuk `git diff` di laravel.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Container berjalan sebagai root, workspace milik user runner.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # sigap:e2e-setup (kode Laravel beku) menolak host DB selain loopback, jadi service `postgres`
      # diteruskan ke 127.0.0.1:5432 di dalam job container (proxy TCP Node, hidup sampai job selesai).
      # Aman: tujuannya container PostgreSQL sekali pakai milik job ini, bukan DB remote.
      - name: Teruskan 127.0.0.1:5432 ke service postgres
        run: |
          nohup node -e "const n=require('net');n.createServer(c=>{const s=n.connect(5432,'postgres');c.pipe(s).pipe(c);c.on('error',()=>s.destroy());s.on('error',()=>c.destroy())}).listen(5432,'127.0.0.1')" > "$RUNNER_TEMP/proxy-pg.log" 2>&1 &
          for _ in $(seq 1 20); do pg_isready -h 127.0.0.1 -p 5432 && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/proxy-pg.log"; exit 1

      # Gagal bila PostgreSQL tidak mengurutkan per byte (`Cipta` sebelum `apel`) atau zona bukan UTC.
      # Lewat 127.0.0.1 = jalur yang sama dengan laravel.sh.
      - name: Database cc_paritas
        env:
          PGHOST: 127.0.0.1
        run: |
          psql -U postgres -v ON_ERROR_STOP=1 -c 'CREATE ROLE cc_migrate LOGIN' -c 'CREATE DATABASE cc_paritas OWNER cc_migrate'
          urut="$(psql -U cc_migrate -d cc_paritas -tAc "SELECT string_agg(x, ',' ORDER BY x) FROM (VALUES ('Cipta'), ('apel')) v(x)")"
          zona="$(psql -U cc_migrate -d cc_paritas -tAc 'SHOW TimeZone')"
          echo "urutan=$urut zona=$zona"
          [ "$urut" = 'Cipta,apel' ] || { echo "Kolasi bukan urutan byte seperti produksi" >&2; exit 1; }
          [ "$zona" = 'UTC' ] || [ "$zona" = 'Etc/UTC' ] || { echo "TimeZone server bukan UTC" >&2; exit 1; }

      # Dev dependencies ikut: sigap:e2e-setup memakai factory (Faker). Aset dibangun laravel.sh.
      - name: Dependensi Laravel
        working-directory: sigap
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Dependensi Playwright
        working-directory: parity
        run: npm ci --no-audit --no-fund

      # Mode tulis (dispatch / push ke rewrite/baseline-linux): baseline hanya ditulis sekali di langkah
      # berikutnya, tidak dicek dulu.
      - name: Suite paritas
        working-directory: parity
        run: |
          if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/rewrite/baseline-linux ] && node -e "process.exit(require('./visual/manifest.json')[process.platform + '-' + process.arch] ? 0 : 1)"; then
            npm run baseline && npx playwright test --project=http
          else
            echo "mode tulis, atau visual/manifest.json belum punya entri $(node -p "process.platform + '-' + process.arch"): hanya project http"
            npx playwright test --project=http
          fi

      - name: Tulis baseline visual Linux
        if: (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/rewrite/baseline-linux') && !cancelled()
        working-directory: parity
        run: npm run baseline -- tulis

      - name: Unggah baseline visual Linux
        if: (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/rewrite/baseline-linux') && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-visual-linux
          path: |
            parity/visual/manifest.json
            parity/.baseline/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Unggah laporan Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laporan-paritas
          path: |
            parity/playwright-report/
            parity/test-results/
          retention-days: 14
          if-no-files-found: ignore
