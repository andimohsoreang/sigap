name: paritas

# Suite paritas (parity/) terhadap Laravel lokal di runner. Laravel di-boot oleh webServer
# parity/playwright.config.ts → parity/scripts/laravel.sh (konfigurasi cermin produksi dari
# parity/env/laravel.env); CI hanya memasang dependensi sigap/ dan menjalankan Playwright.
#
# Baseline visual per platform (parity/visual/{platform}/); baru ada darwin. Sampai baseline Linux
# di-commit, CI hanya menjalankan project `http`. Jalankan workflow ini manual untuk membuat baseline
# Linux dari Laravel (artefak `baseline-visual-linux`), tinjau, lalu commit ke parity/visual/linux/.
on:
  workflow_dispatch:
  push:
    branches: ['rewrite/**']
    paths: ['parity/**', 'web/**', 'sigap/**', '.github/workflows/paritas.yml']
  pull_request:
    branches: ['rewrite/**', 'feat/contact-center-ai']

# Hanya-baca. Unggah artefak memakai token runtime Actions, bukan GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: paritas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paritas:
    name: Paritas vs Laravel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_sqlite
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            sigap/package-lock.json
            parity/package-lock.json

      # Dev dependencies ikut: sigap:e2e-setup memakai factory (Faker). Aset dibangun laravel.sh.
      - name: Dependensi Laravel
        working-directory: sigap
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Dependensi Playwright
        working-directory: parity
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Suite paritas (http)
        working-directory: parity
        run: npx playwright test --project=http

      - name: Buat baseline visual Linux
        if: github.event_name == 'workflow_dispatch' && !cancelled()
        working-directory: parity
        run: npx playwright test --project=desktop --project=tablet --project=mobile --update-snapshots

      - name: Unggah baseline visual Linux
        if: github.event_name == 'workflow_dispatch' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-visual-linux
          path: parity/visual/linux/
          retention-days: 14
          if-no-files-found: error

      - name: Unggah laporan Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laporan-paritas
          path: |
            parity/playwright-report/
            parity/test-results/
          retention-days: 14
          if-no-files-found: ignore
