name: paritas

# Suite paritas (parity/) terhadap Laravel lokal di runner. Laravel di-boot oleh webServer
# parity/playwright.config.ts → parity/scripts/laravel.sh (konfigurasi cermin produksi dari
# parity/env/laravel.env, PostgreSQL cc_paritas milik cc_migrate di 127.0.0.1:5432); CI hanya
# menyiapkan PostgreSQL, dependensi sigap/, dan menjalankan Playwright. laravel.sh menolak jalan bila
# sigap/ berbeda dari tag laravel-baseline, jadi checkout memuat riwayat & tag.
#
# Baseline visual (parity/README.md): PNG/DOM Laravel dibuat di mesin yang sama dengan pembandingan
# (.baseline/<platform>, tidak di-commit); hashnya per platform di parity/visual/manifest.json.
#   - Selama manifest belum punya entri `linux`: PR/push hanya menjalankan project `http`.
#   - Jalankan workflow ini manual → `npm run baseline -- tulis` di runner; artefak
#     `baseline-visual-linux` berisi visual/manifest.json (entri linux) + .baseline/linux untuk
#     ditinjau manusia, lalu commit HANYA visual/manifest.json.
#   - Setelah entri `linux` ter-commit, langkah suite otomatis beralih ke
#     `npm run baseline && npx playwright test` (baseline dibuat ulang, dicek ke manifest, lalu suite penuh).
on:
  workflow_dispatch:
  push:
    branches: ['rewrite/**']
    paths: ['parity/**', 'web/**', 'sigap/**', '.github/workflows/paritas.yml']
  # Tinjau ulang filter paths ini bila `paritas` dijadikan required status check: check wajib yang
  # tidak terpicu karena paths tetap "pending" dan memblokir merge.
  pull_request:
    branches: ['rewrite/**', 'feat/contact-center-ai']
    paths: ['parity/**', 'web/**', 'sigap/**', '.github/workflows/paritas.yml']

# Hanya-baca. Unggah artefak memakai token runtime Actions, bukan GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: paritas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paritas:
    name: Paritas vs Laravel
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Image keluarga yang sama dengan produksi (deploy/docker/compose.yml: postgres:16-alpine), dipin
    # digest: kolasi musl en_US.utf8 = urutan byte, zona UTC, seperti produksi.
    services:
      postgres:
        image: postgres:16-alpine@sha256:f377d590e5474681d4d7838635031a2b50647923b7abfa803ce9b5ff35d5c663
        env:
          # KHUSUS UJI: env/laravel.env memaksa DB_PASSWORD kosong (sama dengan setup lokal `trust`),
          # jadi tanpa sandi. Container hanya hidup selama job di runner sekali pakai.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      # fetch-depth 0: tag laravel-baseline & commit-nya harus ada untuk `git diff` di laravel.sh.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Database cc_paritas
        env:
          PGHOST: 127.0.0.1
          PGUSER: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE cc_migrate LOGIN' -c 'CREATE DATABASE cc_paritas OWNER cc_migrate'
          psql -tAc "SELECT datcollate, current_setting('TimeZone') FROM pg_database WHERE datname = 'cc_paritas'"

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_pgsql
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            sigap/package-lock.json
            parity/package-lock.json

      # Dev dependencies ikut: sigap:e2e-setup memakai factory (Faker). Aset dibangun laravel.sh.
      - name: Dependensi Laravel
        working-directory: sigap
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci --no-audit --no-fund

      - name: Dependensi Playwright
        id: pw
        working-directory: parity
        run: |
          npm ci --no-audit --no-fund
          echo "versi=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      # Hanya chromium-headless-shell: parity/playwright.config.ts memakai devices['Desktop Chrome']
      # tanpa `channel` dan tanpa headed, jadi shell itulah yang dijalankan. Browser di-cache per
      # OS + versi @playwright/test (+ `-shell` agar entri Chromium penuh lama tidak terpakai);
      # paket sistem (apt) tetap dipasang tiap run.
      - name: Cache browser Playwright
        id: cache-pw
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.versi }}-shell

      - name: Pasang Chromium headless shell
        if: steps.cache-pw.outputs.cache-hit != 'true'
        working-directory: parity
        run: npx playwright install --with-deps --only-shell chromium

      - name: Pasang dependensi sistem Chromium
        if: steps.cache-pw.outputs.cache-hit == 'true'
        working-directory: parity
        run: npx playwright install-deps chromium

      - name: Suite paritas
        working-directory: parity
        run: |
          if node -e "process.exit(require('./visual/manifest.json').linux ? 0 : 1)"; then
            npm run baseline && npx playwright test
          else
            echo "visual/manifest.json belum punya entri linux: hanya project http"
            npx playwright test --project=http
          fi

      - name: Tulis baseline visual Linux
        if: github.event_name == 'workflow_dispatch' && !cancelled()
        working-directory: parity
        run: npm run baseline -- tulis

      - name: Unggah baseline visual Linux
        if: github.event_name == 'workflow_dispatch' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: baseline-visual-linux
          path: |
            parity/visual/manifest.json
            parity/.baseline/linux/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Unggah laporan Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laporan-paritas
          path: |
            parity/playwright-report/
            parity/test-results/
          retention-days: 14
          if-no-files-found: ignore
