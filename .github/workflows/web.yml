name: web

# CI aplikasi Next.js (web/) selama rewrite: lint, typecheck, test, cek:css (termasuk build), dan
# build image. Skrip mengikuti kontrak bersama S0 (docs/slices/S0.md). sigap/ ikut memicu karena
# Tailwind web/ memindai sigap/ dan cek:css membandingkan dengan build Laravel.
on:
  push:
    branches: ['rewrite/**', 's0/**']
    paths: ['web/**', 'sigap/**', 'deploy/next/**', '.github/workflows/web.yml']
  pull_request:
    branches: ['rewrite/**', 's0/**', 'feat/contact-center-ai']
    paths: ['web/**', 'sigap/**', 'deploy/next/**', '.github/workflows/web.yml']

# Hanya-baca: tidak ada langkah yang menulis ke repo, rilis, registry, atau PR.
permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  web:
    name: Web (lint, typecheck, test, cek:css + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Sama dengan zona proses produksi.
    env:
      TZ: Asia/Jakarta
    # Valkey untuk test rate limit (tests/unit/batas-valkey.test.ts, skrip Lua sungguhan). Image & digest sama dengan
    # deploy/next/compose.yml; tanpa sandi, hanya hidup selama job.
    services:
      valkey:
        image: valkey/valkey:9.0.7-alpine3.24@sha256:2d04268dfa26ab31cfa3fdc538866e76438b2d00e41db41b8cb86d780ac5a416
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      # Aksi dipin ke SHA commit penuh (tag di komentar), sama seperti lint.yml/tests.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            sigap/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # Job ini tanpa PostgreSQL/PHP: test DB (tests/unit/db) dilewati di sini dan wajib jalan di paritas.yml.
      # Valkey wajib (CC_TEST_VALKEY=1): gagal, bukan dilewati, bila service valkey tidak terjangkau.
      - run: npm run test
        env:
          CC_TEST_DB: '0'
          CC_TEST_VALKEY: '1'
      # cek:css menjalankan npm ci + vite build di sigap/ lalu next build, dan gagal bila CSS berbeda.
      - run: npm run cek:css

  image:
    name: Build image (tanpa push)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Compose stack subdomain uji sah (interpolasi dari .env.example yang memuat semua kunci wajib); tidak
      # menjalankan container apa pun.
      - run: docker compose --env-file deploy/next/.env.example -f deploy/next/compose.yml config --quiet

      # BuildKit (bawaan Docker runner) memakai deploy/next/Dockerfile.dockerignore untuk konteks ini.
      - run: docker build -f deploy/next/Dockerfile -t contact-center-web:ci .
