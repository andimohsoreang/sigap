name: web

# CI aplikasi Next.js (web/) selama rewrite: lint, typecheck, test, cek:css (termasuk build), dan
# build image. Skrip mengikuti kontrak bersama S0 (docs/slices/S0.md). sigap/ ikut memicu karena
# Tailwind web/ memindai sigap/ dan cek:css membandingkan dengan build Laravel.
on:
  push:
    branches: ['rewrite/**', 's0/**']
    paths: ['web/**', 'sigap/**', 'deploy/next/**', '.github/workflows/web.yml']
  pull_request:
    branches: ['rewrite/**', 's0/**', 'feat/contact-center-ai']
    paths: ['web/**', 'sigap/**', 'deploy/next/**', '.github/workflows/web.yml']

# Hanya-baca: tidak ada langkah yang menulis ke repo, rilis, registry, atau PR.
permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  web:
    name: Web (lint, typecheck, test, cek:css + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Sama dengan zona proses produksi.
    env:
      TZ: Asia/Jakarta
    defaults:
      run:
        working-directory: web
    steps:
      # Aksi dipin ke SHA commit penuh (tag di komentar), sama seperti lint.yml/tests.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            sigap/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # Job ini tanpa PostgreSQL/PHP: test DB (tests/unit/db) dilewati di sini dan wajib jalan di paritas.yml.
      - run: npm run test
        env:
          CC_TEST_DB: '0'
      # cek:css menjalankan npm ci + vite build di sigap/ lalu next build, dan gagal bila CSS berbeda.
      - run: npm run cek:css

  image:
    name: Build image (tanpa push)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # BuildKit (bawaan Docker runner) memakai deploy/next/Dockerfile.dockerignore untuk konteks ini.
      - run: docker build -f deploy/next/Dockerfile -t contact-center-web:ci .
